<title>Short-Distance Plan Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Inputs, paces, weekly table, one week in detail. Same track-red system as the other running tools. */
:root {
  --bg: #f2f2f1;
  --surface: #ffffff;
  --surface-2: #f0f0ee;
  --fg: #17181a;
  --muted: #6a6d72;
  --line: #deded9;
  --accent: #c8372d;
  --accent-fg: #ffffff;
  --accent-soft: #f6dcd9;
  --warn: #a35a00;
  --font-display: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1c1c1f; --surface-2: #25252a; --fg: #ececea; --muted: #9a9ca2;
    --line: #34343a; --accent: #ef6a5e; --accent-fg: #1a0b09; --accent-soft: #3a1f1c; --warn: #f0a35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1c1c1f; --surface-2: #25252a; --fg: #ececea; --muted: #9a9ca2;
  --line: #34343a; --accent: #ef6a5e; --accent-fg: #1a0b09; --accent-soft: #3a1f1c; --warn: #f0a35a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 20px; }
.wrap > * { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); }
.head > div:first-child { min-width: 0; }
.head { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
.themes { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); color: var(--muted); cursor: pointer; }
.themes:hover { color: var(--fg); }
.themes:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.themes svg { display: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.themes[data-mode="system"] .i-system, .themes[data-mode="light"] .i-light, .themes[data-mode="dark"] .i-dark { display: block; }
.themes .i-system path { fill: currentColor; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 720px) { .top { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 18px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.panel h2 { margin: 0; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: end; }
.grid4 .span2 { grid-column: span 2; }
.combo { display: grid; grid-template-columns: minmax(0, 1fr) 4.5rem; gap: 6px; }
@media (max-width: 720px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: end; }
.fields .full { grid-column: 1 / -1; }
[hidden] { display: none !important; }
label { display: grid; gap: 4px; align-content: start; font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
input, select { box-sizing: border-box; height: 2.75rem; font: inherit; font-size: 1.05rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 0 10px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.chk { display: flex; align-items: center; gap: 10px; min-height: 2.75rem; text-transform: none; letter-spacing: 0; font-size: .95rem; font-weight: 500; color: var(--fg); }
label.chk input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
.note { font-size: .85rem; color: var(--muted); margin: 0; }
.warn { color: var(--warn); font-size: .88rem; margin: 0; }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .res { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.res div { background: var(--surface-2); border-radius: 2px; padding: 10px 12px; min-width: 0; }
.res b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.res b.pace { color: var(--accent); }
.res span { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.res small { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
.struct { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.pace { font-weight: 600; white-space: nowrap; }
tr.hard td:first-child { border-left: 3px solid var(--accent); padding-left: 8px; }
tr.easy td:first-child { padding-left: 11px; }
.notes { display: grid; gap: 6px; }
.method { font-size: .88rem; color: var(--muted); display: grid; gap: 6px; }
.method ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.method b { color: var(--fg); font-weight: 600; }
.flag { color: var(--warn); font-size: .85rem; }
.flag.red { color: var(--accent); font-weight: 600; }
tr.cur td { color: var(--muted); }
td.num, th.num { text-align: right; padding-right: 14px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; }
@media (max-width: 520px) { .three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.num { text-align: right; }
th.num, td.num { padding-right: 0; padding-left: 10px; }
td.q { min-width: 14rem; }
td.q2 { min-width: 24rem; font-size: .9rem; padding-left: 36px; }
th.q2 { padding-left: 36px; }
.s { display: block; }
.s + .s { margin-top: 2px; }
td.q2 small, td small { color: var(--muted); }
td:first-child small { display: block; font-size: .72rem; white-space: nowrap; }
.q1 { padding-left: 28px; }
td.q small { display: block; color: var(--muted); }
tr.rest td { color: var(--muted); }
tr.tot td { font-weight: 600; border-top: 2px solid var(--line); }
.paces { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 12px; }
@media (max-width: 600px) { .paces { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.paces div { background: var(--surface-2); border-radius: 2px; padding: 10px 10px; min-width: 0; }
.paces b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.paces span { display: block; min-height: 2.3em; font-size: .7rem; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.paces small { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
</style>

<main class="wrap">
  <header class="head">
    <div>
      <h1>Short-Distance Plan Viewer</h1>
      <p class="sub">Daniels 5K to 10K plans and Davis's Full-Spectrum 10k plan from a race result, with paces and load. For marathon plans, use the <a href="marathon-plans.html">Marathon Plan Viewer</a>.</p>
    </div>
    <button type="button" class="themes" id="themebtn" data-mode="system" aria-label="Theme: auto. Click to change." title="Theme: auto">
      <svg class="i-system" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg>
      <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <section class="panel">
    <h2>Inputs</h2>
    <div class="grid4">
      <label>Race
        <select id="dist">
          <option value="1.5">1500m</option>
          <option value="1.609344">Mile</option>
          <option value="3">3km</option>
          <option value="5" selected>5km</option>
          <option value="10">10km</option>
          <option value="21.0975">Half marathon</option>
        </select>
      </label>
      <label>Race time
        <input id="time" type="text" inputmode="numeric" autocomplete="off" value="20:00" placeholder="39:43 or 3943">
      </label>
      <label>Units
        <select id="wunit" aria-label="Unit">
          <option value="km" selected>Kilometres</option>
          <option value="mi">Miles</option>
        </select>
      </label>
      <label>Starting CTL (optional)
        <input id="ctl" type="text" inputmode="decimal" autocomplete="off" value="" placeholder="estimated">
      </label>
      <label class="span2">Plan
        <select id="plan"></select>
      </label>
      <label id="f-week"><span id="weeklab">Weekly distance</span>
        <input id="week" type="text" inputmode="decimal" autocomplete="off" value="" placeholder="middle of range">
      </label>
      <label id="f-goal">Goal race
        <select id="goal"><option value="5">5km</option><option value="10" selected>10km</option></select>
      </label>
      <label class="span2" id="f-rw">Races in Phase IV
        <select id="rw">
          <option value="last" selected>Race on the last Saturday (week 18)</option>
          <option value="none">No races</option>
          <option value="all">A race every Saturday</option>
        </select>
      </label>
      <label id="f-hm">H pace
        <select id="hm"><option value="I" selected>Same as I pace</option><option value="mid">Halfway between T and I</option></select>
      </label>
      <label class="chk span2" id="f-adjt"><input id="adjt" type="checkbox" checked> Shorten threshold reps for slower runners</label>
      <label>Easy pace basis
        <select id="emode"><option value="book" selected>As written in the book</option><option value="mine">My easy pace setting</option></select>
      </label>
      <label>My easy pace setting (% of 5km speed)
        <input id="ezp" type="text" inputmode="decimal" autocomplete="off" value="65">
      </label>
    </div>
  </section>

  <p class="warn" id="err" hidden></p>

  <section id="resbox">
    <h2>Paces</h2>
    <div class="panel">
      <div class="paces" id="paces"></div>
      <div class="notes" id="pnote"></div>
    </div>
    <h2 style="margin-top:20px" id="wtitle">Weeks</h2>
    <div class="panel">
      <div class="tablewrap">
        <table>
          <thead><tr><th>Week</th><th class="num">Time</th><th class="num">Distance</th><th class="num">TSS</th><th class="num">CTL</th><th class="num">ATL</th><th class="num">Ramp</th><th class="q2">Sessions</th></tr></thead>
          <tbody id="wrows"></tbody>
        </table>
      </div>
      <p class="note" id="wnote"></p>
    </div>
  </section>

  <section id="detail">
    <h2>One week in detail</h2>
    <div class="panel">
      <div class="fields">
        <label>Week
          <select id="wk"></select>
        </label>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Session</th><th>Pace</th><th class="num">Distance</th><th class="num">Time</th><th class="num">TSS</th></tr></thead>
          <tbody id="drows"></tbody>
        </table>
      </div>
      <p class="note" id="dnote"></p>
    </div>
  </section>

  <section class="panel method">
    <h2 id="mtitle">Notes</h2>
    <ul id="notes"></ul>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function pers() {
    var e = ($("ezp").value || "").trim().replace(",", ".");
    e = e === "" ? 65 : Number(e);
    if (!isFinite(e) || e < 50 || e > 85) return { err: "Easy pace must be 50 to 85% of 5km speed." };
    return { e: e / 100, bk: $("emode").value !== "mine" };
  }
  /*@@CORE-BEGIN@@ Shared code. Edit shared/core.js and run sync_core.py; do not edit between these markers. */
  var K = 1.06, HM = 21.0975, MAR = 42.195, MILE = 1.609344;
  // Slowing applied to the 5km equivalent when the input race is shorter than 5km, in s/km (my estimate).
  function adj(km) { return km < 5 ? 6.5 * Math.log(5 / km) : 0; }
  var offM = 5;   // marathon slow-down in s/km, set per page from the weekly distance
  function off(km) { return km <= HM ? 0 : offM * (Math.min(km, MAR) - HM) / (MAR - HM); }
  // Marathon time as a multiple of the half marathon, by weekly miles. 2.10 at 70 miles or more (also checked against Kejelcha's 56:51 half and 1:59:41 marathon, ratio 2.105); the lower-mileage points are placeholders.
  function marathonFactor(weekKm) {
    var mi = weekKm / 1.609344;
    var P = [[70, 2.10], [60, 2.13], [50, 2.17], [35, 2.25]];   // [miles per week, marathon / half marathon]
    if (mi >= P[0][0]) return P[0][1];
    for (var i = 1; i < P.length; i++) {
      if (mi >= P[i][0]) { var f = (P[i - 1][0] - mi) / (P[i - 1][0] - P[i][0]); return P[i - 1][1] + f * (P[i][1] - P[i - 1][1]); }
    }
    return P[P.length - 1][1];
  }
  // p5r = 5km-equivalent pace from Riegel (s/km). Returns the marathon slow-down in s/km.
  function marathonOff(p5r, weekKm) {
    if (weekKm === null) weekKm = 70 * 1.609344;
    var H0 = p5r * Math.pow(HM / 5, K - 1) * HM, M0 = p5r * Math.pow(MAR / 5, K - 1) * MAR;
    return Math.max(0, (marathonFactor(weekKm) * H0 - M0) / MAR);
  }
  function parseTime(str) {
    str = (str || "").trim();
    if (!str) return null;
    if (/^\d{3,6}$/.test(str)) {                                       // digits only: read from the right
      var sec = str.slice(-2), rest = str.slice(0, -2);
      if (Number(sec) >= 60) return null;
      if (rest.length > 2) { if (Number(rest.slice(-2)) >= 60) return null; str = rest.slice(0, -2) + ":" + rest.slice(-2) + ":" + sec; }
      else str = rest + ":" + sec;
    }
    // Strict forms only: plain minutes (1 or 2 digits, decimals allowed), m:ss(.ff), h:mm:ss(.ff); minutes and seconds after the first part must be 00 to 59.
    if (/^\d{1,2}(\.\d+)?$/.test(str)) return Number(str) * 60;
    var m = /^(\d+):([0-5]\d(?:\.\d+)?)$/.exec(str);
    if (m) return Number(m[1]) * 60 + Number(m[2]);
    m = /^(\d+):([0-5]\d):([0-5]\d(?:\.\d+)?)$/.exec(str);
    if (m) return Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]);
    return null;
  }
  function mmss(sec) {
    sec = Math.round(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function hmmss(sec) {
    sec = Math.round(sec);
    var h = Math.floor(sec / 3600), r = sec - h * 3600;
    return h > 0 ? h + ":" + (Math.floor(r / 60) < 10 ? "0" : "") + mmss(r) : mmss(r);
  }
  // Daniels-Gilbert VDOT for a race of `min` minutes over `m` metres.
  function vdot(min, m) {
    var v = m / min;
    var vo2 = -4.60 + 0.182258 * v + 0.000104 * v * v;
    var pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * min) + 0.2989558 * Math.exp(-0.1932605 * min);
    return vo2 / pct;
  }
  /*@@CORE-END@@*/

  function profGet() { try { return JSON.parse(localStorage.getItem("tt-profile") || "null") || {}; } catch (e) { return {}; } }
  function profSet(k, v) { try { var o = profGet(); o[k] = v; localStorage.setItem("tt-profile", JSON.stringify(o)); } catch (e) {} }

  var U = "km";
  function ds(mi) { return String(Math.round((U === "mi" ? mi : mi * MILE) * 10) / 10); }    // miles to the display unit
  function dk(km) { return String(Math.round((U === "km" ? km : km / MILE) * 10) / 10); }    // km to the display unit
  function dd(km) { return String(Math.round((U === "km" ? km : km / MILE) * 100) / 100); }  // km to the display unit, two decimals
  function pm(sec) { return mmss(U === "mi" ? sec : sec / MILE); }                           // pace from s per mile
  function pk(sec) { return mmss(U === "km" ? sec : sec * MILE); }                           // pace from s per km
  function tm(sec) { sec = Math.round(sec / 5) * 5; return sec >= 3600 ? hmmss(sec) : mmss(sec); }
  function ht(sec) { var m = Math.round(sec / 60); return Math.floor(m / 60) + ":" + (m % 60 < 10 ? "0" : "") + (m % 60); }
  function sgn(x) { var v = Math.round(x * 10) / 10; return (v > 0 ? "+" : "") + v.toFixed(1); }
  function trow(lbl, pt, dist, time, tss) { return "<tr><td>" + lbl + "</td><td class='pace'>" + (pt || "") + "</td><td class='num'>" + (dist || "") + "</td><td class='num'>" + (time || "") + "</td><td class='num'>" + (tss || "") + "</td></tr>"; }
  function thead(t) { return "<tr class='tot'><td colspan='5'>" + t + "</td></tr>"; }
  function ttot(dist, time, tss) { return "<tr class='rest'><td>Total</td><td></td><td class='num'>" + dist + "</td><td class='num'>" + time + "</td><td class='num'>" + tss + "</td></tr>"; }
  function mkRaceP(c) { return function (km) { return (c.p5 - adj(km)) * Math.pow(km / 5, K - 1) + off(km) - off(c.D); }; }
  var LOADNOTE = "TSS = hours &times; (threshold pace &divide; pace)&sup2; &times; 100, with threshold as race(16). CTL has a 42-day and ATL a 7-day time constant. Start CTL, if blank, is week 1's TSS divided by 7.";
  function dr(lo, hi) { return Math.abs(hi - lo) < 0.05 ? ds(lo) : ds(lo) + "-" + ds(hi); }
  function trange(lo, hi) { return Math.abs(hi - lo) < 3 ? tm(lo) : tm(lo) + "-" + tm(hi); }
  function tr(lo, hi) { return Math.abs(hi - lo) < 1 ? String(Math.round(lo)) : Math.round(lo) + "-" + Math.round(hi); }
  function rowHtml(r) { return trow(r.lbl, r.pt || "", r.dhi > 0 ? dr(r.dlo, r.dhi) + " " + U : "", r.thi > 0 ? trange(r.tlo, r.thi) : "", r.shi > 0 ? tr(r.slo, r.shi) : ""); }

  // ---------- Daniels 5K to 10K ----------
  var DANIELS = (function () {
  // Tables 11.1 and 11.2 of Daniels' Running Formula, Phases II to IV (18 weeks). Days run Sunday to Saturday.
  // "L" long run; "E" easy day; "E:n" easy day with n strides (not scored). A number before E, M or T is miles.
  // NxW<unit><pace>/REC: reps (unit m metres, mi miles, ' minutes); REC = amount + m (metres) or ' (minutes) + j (jog) or r (rest).
  // nS(piece,piece,...)/REC: n sets; a piece is a rep group or a work or jog piece such as 200mR or 400mj. ";n" at the end: n strides.
  var E10 = "E:10", E8 = "E:8", E6 = "E:6", E0 = "E";
  var S6 = function (a) { return a; };
  var T1 = "3x1miT/2'r", T5 = "5x1miT/1'r+2E";
  // Phase IV: [race week, no race] for Tue, Fri and Sat.
  function iv(tueRace, tueNo, friNo) { return ["L", E6, [tueRace, tueNo], E0, E0, [E0, friNo], ["RACE", E0]]; }
  var D1 = {
    mid: 45, lo: 40, hi: 50, name: "Table 11.1, 40 to 50 miles (64 to 80 km) a week",
    p2: [
      ["L", E10, "2E+2S(8x200mR/200mj)/800mj+2E", E8, E0, "2E+4x200mR/200mj+2x1miT/1'r+4x200mR/200mj+2E", E8],
      ["L", E10, "2E+4S(200mR,200mj,200mR,200mj,400mR,400mj)+2E", E8, E0, "2E+3x1miT/1'r+6x200mR/200mj+2E", E8],
      ["1E+9M;6", E10, "2E+4x200mR/200mj+4x400mR/400mj+4x200mR/200mj+2E", E8, E0, "2E+7x2'H/1'j+2E", E8],
      ["L", E10, "2E+4x400mR/400mj+1E+4x400mR/400mj+2E", E8, E0, "2E+4x200mR/200mj+3T+4x200mR/200mj+2E", E8],
      ["L", E10, "2E+5S(200mR,200mj,200mR,400mj,400mR,200mj)+2E", E8, E0, "2E+4x1miT/1'r+4x200mR/200mj+2E", E8],
      ["1E+9M;6", E10, "2E+10x400mR/400mj+2E", E8, E0, "2E+3x3'H/2'j+4x2'H/2'j+2E", E8]
    ],

    try { localStorage.setItem("sp", JSON.stringify({ p: $("plan").value, c: $("ctl").value, w: $("week").value, g: $("goal").value, r: $("rw").value, h: $("hm").value, j: $("adjt").checked })); } catch (e) {}
  }
  function restore() {
    try {
      var s = JSON.parse(localStorage.getItem("sp") || "null");
      if (s) {
        fillPlans();
        if (s.p && $("plan").querySelector('option[value="' + s.p + '"]')) $("plan").value = s.p;
        if (typeof s.c === "string") $("ctl").value = s.c;
        if (typeof s.w === "string") $("week").value = s.w;
        if (s.g === "5" || s.g === "10") $("goal").value = s.g;
        if (s.r === "last" || s.r === "none" || s.r === "all") $("rw").value = s.r;
        if (s.h === "I" || s.h === "mid") $("hm").value = s.h;
        if (typeof s.j === "boolean") $("adjt").checked = s.j;
      }
    } catch (e) {}
    var pr = profGet();
    if (pr.km && $("dist").querySelector('option[value="' + pr.km + '"]')) $("dist").value = pr.km;
    if (pr.time) $("time").value = pr.time;
    if (pr.wunit === "km" || pr.wunit === "mi") $("wunit").value = pr.wunit;
    if (typeof pr.ezp === "string") $("ezp").value = pr.ezp;
    if (pr.emode === "book" || pr.emode === "mine") $("emode").value = pr.emode;
  }

  (function () {
    function norm(t) { var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.round(t % 60); return (h ? h + ":" + (m < 10 ? "0" : "") + m : m) + ":" + (s < 10 ? "0" : "") + s; }
    var el = $("time");
    el.addEventListener("change", function () {
      if (!/^\d{3,6}$/.test(el.value.trim())) return;
      var t = parseTime(el.value);
      if (t !== null) { el.value = norm(t); el.dispatchEvent(new Event("input", { bubbles: true })); }
    });
  })();

  restore();
  ["dist", "time", "wunit", "plan", "ctl", "week", "goal", "rw", "hm", "adjt", "ezp", "emode"].forEach(function (id) {
    $(id).addEventListener("input", function () { save(); update(); });
    $(id).addEventListener("change", function () { save(); update(); });
  });
  $("wk").addEventListener("change", renderDetail);
  update();
})();

(function () {
  var btn = document.getElementById("themebtn"), order = ["system", "light", "dark"], names = { system: "auto", light: "light", dark: "dark" };
  function apply(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    btn.setAttribute("data-mode", t);
    btn.setAttribute("aria-label", "Theme: " + names[t] + ". Click to change.");
    btn.title = "Theme: " + names[t];
  }
  var saved = "system";
  try { saved = localStorage.getItem("theme-pref") || "system"; } catch (e) {}
  if (order.indexOf(saved) < 0) saved = "system";
  apply(saved);
  btn.addEventListener("click", function () {
    var t = order[(order.indexOf(btn.getAttribute("data-mode")) + 1) % order.length];
    apply(t);
    try { localStorage.setItem("theme-pref", t); } catch (e) {}
  });
})();
</script>

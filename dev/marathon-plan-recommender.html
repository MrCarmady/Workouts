<title>Marathon Plan Recommender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Which marathon plans fit a starting CTL and ATL. Same track-red system as the other running tools. */
:root {
  --bg: #f2f2f1;
  --surface: #ffffff;
  --surface-2: #f0f0ee;
  --fg: #17181a;
  --muted: #6a6d72;
  --line: #deded9;
  --accent: #c8372d;
  --accent-fg: #ffffff;
  --accent-soft: #f6dcd9;
  --warn: #a35a00;
  --font-display: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1c1c1f; --surface-2: #25252a; --fg: #ececea; --muted: #9a9ca2;
    --line: #34343a; --accent: #ef6a5e; --accent-fg: #1a0b09; --accent-soft: #3a1f1c; --warn: #f0a35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1c1c1f; --surface-2: #25252a; --fg: #ececea; --muted: #9a9ca2;
  --line: #34343a; --accent: #ef6a5e; --accent-fg: #1a0b09; --accent-soft: #3a1f1c; --warn: #f0a35a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 20px; }
.wrap > * { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); }
.head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
.themes { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; background: var(--surface); }
.themes button { font: inherit; font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.themes button + button { border-left: 1px solid var(--line); }
.themes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.themes button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 720px) { .top { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 18px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.panel h2 { margin: 0; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: end; }
.grid4 .span2 { grid-column: span 2; }
.combo { display: grid; grid-template-columns: minmax(0, 1fr) 4.5rem; gap: 6px; }
@media (max-width: 720px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: end; }
.fields .full { grid-column: 1 / -1; }
[hidden] { display: none !important; }
label { display: grid; gap: 4px; align-content: start; font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
input, select { box-sizing: border-box; height: 2.75rem; font: inherit; font-size: 1.05rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 0 10px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.chk { display: flex; align-items: center; gap: 10px; min-height: 2.75rem; text-transform: none; letter-spacing: 0; font-size: .95rem; font-weight: 500; color: var(--fg); }
label.chk input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
.note { font-size: .85rem; color: var(--muted); margin: 0; }
.warn { color: var(--warn); font-size: .88rem; margin: 0; }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .res { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.res div { background: var(--surface-2); border-radius: 2px; padding: 10px 12px; min-width: 0; }
.res b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.res b.pace { color: var(--accent); }
.res span { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.res small { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
.struct { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.pace { font-weight: 600; white-space: nowrap; }
tr.hard td:first-child { border-left: 3px solid var(--accent); padding-left: 8px; }
tr.easy td:first-child { padding-left: 11px; }
.notes { display: grid; gap: 6px; }
.method { font-size: .88rem; color: var(--muted); display: grid; gap: 6px; }
.method ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.method b { color: var(--fg); font-weight: 600; }
.flag { color: var(--warn); font-size: .85rem; }
.flag.red { color: var(--accent); font-weight: 600; }
tr.cur td { color: var(--muted); }
td.num, th.num { text-align: right; padding-right: 14px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; }
@media (max-width: 520px) { .three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.num { text-align: right; }
th.num, td.num { padding-right: 0; padding-left: 10px; }
td.q { min-width: 14rem; }
td.q2 { min-width: 24rem; font-size: .9rem; padding-left: 36px; }
th.q2 { padding-left: 36px; }
.s { display: block; }
.s + .s { margin-top: 2px; }
td.q2 small, td small { color: var(--muted); }
td:first-child small { display: block; font-size: .72rem; white-space: nowrap; }
.q1 { padding-left: 28px; }
td.q small { display: block; color: var(--muted); }
tr.rest td { color: var(--muted); }
tr.tot td { font-weight: 600; border-top: 2px solid var(--line); }
.paces { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 12px; }
@media (max-width: 600px) { .paces { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.paces div { background: var(--surface-2); border-radius: 2px; padding: 10px 10px; min-width: 0; }
.paces b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.paces span { font-size: .7rem; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.paces small { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
</style>
<main class="wrap">
  <header class="head">
    <div>
      <h1>Marathon Plan Recommender</h1>
      <p class="sub">Which Copeland, Daniels, Hansons and Pfitzinger plans fit your current CTL and ATL, judged on form and the ATL to CTL ratio.</p>
    </div>
    <div class="themes" role="group" aria-label="Theme">
      <button type="button" data-theme-set="system" aria-pressed="true">Auto</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <section class="panel">
    <h2>Inputs</h2>
    <div class="grid4">
      <label>Race
        <select id="dist">
          <option value="1.5">1500m</option>
          <option value="1.609344">Mile</option>
          <option value="3">3km</option>
          <option value="5" selected>5km</option>
          <option value="10">10km</option>
          <option value="21.0975">Half marathon</option>
        </select>
      </label>
      <label>Race time
        <input id="time" type="text" inputmode="numeric" autocomplete="off" value="20:00" placeholder="39:43 or 3943">
      </label>
      <label>Start CTL
        <input id="ctl" type="text" inputmode="decimal" autocomplete="off" value="50">
      </label>
      <label>Start ATL
        <input id="atl" type="text" inputmode="decimal" autocomplete="off" value="" placeholder="same as CTL">
      </label>
      <label>Lowest form allowed
        <input id="floor" type="text" inputmode="decimal" autocomplete="off" value="-20">
      </label>
      <label>Highest ATL / CTL
        <input id="maxr" type="text" inputmode="decimal" autocomplete="off" value="1.3">
      </label>
    </div>
  </section>

  <p class="warn" id="err" hidden></p>

  <section id="resbox">
    <h2 id="rtitle">Plans</h2>
    <div class="panel">
      <p id="summary" class="struct"></p>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Plan</th><th class="num">Weeks</th><th class="num">Week 1 TSS/day</th><th class="num">Peak 4-week TSS/day</th><th class="num">Lowest form</th><th class="num">Highest ATL/CTL</th><th class="q2">Result</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note" id="rnote"></p>
    </div>
  </section>

  <section class="panel method">
    <h2>Notes</h2>
    <ul id="notes"></ul>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return SHIM[id] || document.getElementById(id); };
  // Inputs the plan builders read on Marathon Plans, fixed here at that page's defaults.
  var SHIM = { week: { value: "40" }, adjt: { checked: true }, days: { value: "6" }, rep5: { value: "16.5" }, lp: { value: "85" }, rd: { value: "10" }, rec: { checked: false } };
  /*@@CORE-BEGIN@@ Shared code. Edit shared/core.js and run sync_core.py; do not edit between these markers. */
  var K = 1.06, HM = 21.0975, MAR = 42.195, MILE = 1.609344;
  // Slowing applied to the 5km equivalent when the input race is shorter than 5km, in s/km (my estimate).
  function adj(km) { return km < 5 ? 6.5 * Math.log(5 / km) : 0; }
  var offM = 5;   // marathon slow-down in s/km, set per page from the weekly distance
  function off(km) { return km <= HM ? 0 : offM * (Math.min(km, MAR) - HM) / (MAR - HM); }
  function marathonExtraMin(weekKm) {
    var mi = weekKm / 1.609344;
    var P = [[80, 7], [70, 10], [60, 13], [50, 17], [35, 25]];   // [miles per week, minutes added to 2 x half marathon]
    if (mi >= P[0][0]) return P[0][1];
    for (var i = 1; i < P.length; i++) {
      if (mi >= P[i][0]) { var f = (P[i - 1][0] - mi) / (P[i - 1][0] - P[i][0]); return P[i - 1][1] + f * (P[i][1] - P[i - 1][1]); }
    }
    return P[P.length - 1][1];
  }
  // p5r = 5km-equivalent pace from Riegel (s/km). Returns the marathon slow-down in s/km.
  function marathonOff(p5r, weekKm) {
    if (weekKm === null) weekKm = 70 * 1.609344;
    var H0 = p5r * Math.pow(HM / 5, K - 1) * HM, M0 = p5r * Math.pow(MAR / 5, K - 1) * MAR;
    return Math.max(0, (marathonExtraMin(weekKm) * 60 - (M0 - 2 * H0)) / MAR);
  }
  function parseTime(str) {
    str = (str || "").trim();
    if (!str) return null;
    if (/^\d{3,6}$/.test(str)) {                                       // digits only: read from the right
      var sec = str.slice(-2), rest = str.slice(0, -2);
      if (Number(sec) >= 60) return null;
      if (rest.length > 2) { if (Number(rest.slice(-2)) >= 60) return null; str = rest.slice(0, -2) + ":" + rest.slice(-2) + ":" + sec; }
      else str = rest + ":" + sec;
    }
    var parts = str.split(":");
    if (parts.length > 3) return null;
    var nums = parts.map(function (p) { return p === "" ? NaN : Number(p); });
    if (nums.some(function (x) { return isNaN(x) || x < 0; })) return null;
    if (parts.length === 1) return nums[0] * 60;                       // plain number = minutes
    if (parts.length === 2) return nums[0] * 60 + nums[1];
    return nums[0] * 3600 + nums[1] * 60 + nums[2];
  }
  function mmss(sec) {
    sec = Math.round(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function hmmss(sec) {
    sec = Math.round(sec);
    var h = Math.floor(sec / 3600), r = sec - h * 3600;
    return h > 0 ? h + ":" + (Math.floor(r / 60) < 10 ? "0" : "") + mmss(r) : mmss(r);
  }
  // Daniels-Gilbert VDOT for a race of `min` minutes over `m` metres.
  function vdot(min, m) {
    var v = m / min;
    var vo2 = -4.60 + 0.182258 * v + 0.000104 * v * v;
    var pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * min) + 0.2989558 * Math.exp(-0.1932605 * min);
    return vo2 / pct;
  }
  /*@@CORE-END@@*/

  function profGet() { try { return JSON.parse(localStorage.getItem("tt-profile") || "null") || {}; } catch (e) { return {}; } }
  function profSet(k, v) { try { var o = profGet(); o[k] = v; localStorage.setItem("tt-profile", JSON.stringify(o)); } catch (e) {} }

  /*@@PLANS-BEGIN@@ Copied from marathon-plans.html between these markers. tests/check_plans_sync.py fails the build if they differ. */
  var U = "mi";
  function ds(mi) { return String(Math.round((U === "mi" ? mi : mi * MILE) * 10) / 10); }    // miles to the display unit
  function dk(km) { return String(Math.round((U === "km" ? km : km / MILE) * 10) / 10); }    // km to the display unit
  function pm(sec) { return mmss(U === "mi" ? sec : sec / MILE); }                           // pace from s per mile
  function pk(sec) { return mmss(U === "km" ? sec : sec * MILE); }                           // pace from s per km
  function tm(sec) { sec = Math.round(sec / 5) * 5; return sec >= 3600 ? hmmss(sec) : mmss(sec); }
  function ht(sec) { var m = Math.round(sec / 60); return Math.floor(m / 60) + ":" + (m % 60 < 10 ? "0" : "") + (m % 60); }
  function sgn(x) { var v = Math.round(x * 10) / 10; return (v > 0 ? "+" : "") + v.toFixed(1); }
  function trow(lbl, pt, dist, time, tss) { return "<tr><td>" + lbl + "</td><td class='pace'>" + (pt || "") + "</td><td class='num'>" + (dist || "") + "</td><td class='num'>" + (time || "") + "</td><td class='num'>" + (tss || "") + "</td></tr>"; }
  function thead(t) { return "<tr class='tot'><td colspan='5'>" + t + "</td></tr>"; }
  function ttot(dist, time, tss) { return "<tr class='rest'><td>Total</td><td></td><td class='num'>" + dist + "</td><td class='num'>" + time + "</td><td class='num'>" + tss + "</td></tr>"; }
  function mkRaceP(c) { return function (km) { return (c.p5 - adj(km)) * Math.pow(km / 5, K - 1) + off(km) - off(c.D); }; }
  var DAYN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var LOADNOTE = "TSS = hours &times; (threshold pace &divide; pace)&sup2; &times; 100, with threshold as race(16). CTL has a 42-day and ATL a 7-day time constant. Start CTL, if blank, is week 1's TSS divided by 7.";

  // ---------- Daniels 2Q ----------
  var DANIELS = (function () {
  // The 2QA, 2QB and 2QC plans, from Daniels' 2Q. Numbers before E, M, T are miles. "w/" = recovery between reps. Week 18 is by day.
  var PLAN_A = [
    [0.8, "3E+4M+1T+1M+2E", "5E+2T+2 min rest+1E+2x(1T w/ 1 min rest)+2E"],
    [0.8, "2E+2x(1T w/ 1 min rest)+30 min E+2x(1T w/ 1 min rest)+2E", "3E+6x(2 min I w/ 2 min jog)+4x(1 min R w/ 2 min jog)+2E"],
    [0.9, "90-110 min E", "5E+4x(1T w/ 1 min rest)+2E"],
    [0.9, "2E+5M+1T+1M+2E", "40 min E+4x(1T w/ 1 min rest)+2E"],
    [0.9, "2E+2x(1T w/ 1 min rest)+30 min E+2x(1T w/ 1 min rest)+2E", "40 min E+5x(3 min I w/ 2 min jog)+2E"],
    [0.9, "90-120 min E", "40 min E+2x(2T w/ 2 min rest)+2E"],
    [1.0, "4E+6M+1T+1E", "6E+3T+3 min E+1T+2E"],
    [0.9, "9E+4x(1T w/ 1 min rest)+1E", "6E+3x(4 min I w/ 3 min jog)+4x(1 min R w/ 2 min jog)+2E"],
    [1.0, "120-130 min E", "6E+6M+2E"],
    [1.0, "4E+1T+8M+2E", "4E+2T+2 min E+2T+2 min E+1T+2E"],
    [0.9, "5E+9M+2E", "9E+5x(3 min I w/ 2 min jog)+3x(2 min I w/ 1 min jog)+2E"],
    [0.9, "130-150 min E", "2E+10M+1T+2E"],
    [1.0, "3E+12M+1E", "45 min E+2x(2T w/ 2 min rest)+1T+1E"],
    [1.0, "2E+2T+60 min E+2x(1T w/ 1 min rest)+2E", "6E+5x(3 min I w/ 2 min jog)+4x(1 min R w/ 2 min jog)+2E"],
    [0.9, "150 min E", "6E+5x(3 min I w/ 3 min jog)+1T+4E"],
    [0.9, "1E+8M+1E+6M+1E", "6E+4x(1T w/ 1 min rest)+2E"],
    [0.9, "1E+2x(2T w/ 2 min rest)+60 min E", "4E+1T+2M+1E+1T+2M+1E"]
  ];
  var RACE_A = [["7", "90 min E"], ["6", "60 min E"], ["5", "2E+5x(800m T w/ 2 min jog)+1E"], ["4", "50 min E"], ["3", "30-40 min E"], ["2", "0-20 min E"], ["1", "20-30 min E"], ["0", "Race"]];
  // 2QB (41 to 55 miles a week) and 2QC (56 to 70), weeks 18 to 2 until the race, from the book's tables as given by the author.
  var PLAN_B = [
    [0.8, "4E+8M+1T+1E", "8E+2x(2T w/ 2 min rest)+1T+2E"],
    [0.8, "2E+3T+40 min E+2T+1E", "6E+5x(3 min I w/ 2 min jog)+6x(1 min R w/ 2 min jog)+2E"],
    [0.9, "90-120 min E", "6E+2T+2 min E+2T+2 min E+1T+2E"],
    [0.9, "2E+8M+1E+2M+2E", "40 min E+3x(2T w/ 2 min rest)+2E"],
    [0.9, "1E+2x(2T w/ 2 min rest)+60 min E+1T+1E", "6E+5x(4 min I w/ 3 min jog)+2E"],
    [0.9, "100-120 min E", "40 min E+3x(2T w/ 2 min rest)+2E"],
    [1.0, "2E+6M+1E+6M+1E", "6E+3T+3 min E+2T+2 min E+1T+2E"],
    [0.9, "10E+2x(2T w/ 2 min rest)+2E", "8E+5x(3 min I w/ 2 min jog)+6x(1 min R w/ 2 min jog)+2E"],
    [1.0, "120 min E", "2E+12M+2E"],
    [1.0, "2E+6M+1E+4M+1T+1E", "5E+3x(2T w/ 2 min rest)+1T+2E"],
    [0.9, "60 min E+8M+1E", "8E+4x(4 min I w/ 3 min jog)+3E"],
    [0.9, "120-150 min E", "2E+8M+3x(1T w/ 1 min rest)+2E"],
    [1.0, "2E+14M+1E", "60 min E+3x(2T w/ 2 min rest)+1T+1E"],
    [1.0, "2E+3T+60 min E+2T+2E", "8E+5x(3 min I w/ 2 min jog)+4x(1 min R w/ 2 min jog)+3E"],
    [0.9, "150 min E", "6E+5x(3 min I w/ 2 min jog)+4E"],
    [0.9, "1E+8M+1E+6M+1E", "4E+2x(2T w/ 2 min rest)+3x(1T w/ 1 min rest)+2E"],
    [0.9, "1E+3x(2T w/ 2 min rest)+60 min E", "4E+1T+2M+1E+1T+2M+2E"]
  ];
  var RACE_B = [["7", "90 min E"], ["6", "60 min E"], ["5", "2E+3x(1T w/ 2 min rest)+2E"], ["4", "50 min E"], ["3", "30-40 min E"], ["2", "0-20 min E"], ["1", "20-30 min E"], ["0", "Race"]];
  var PLAN_C = [
    [0.8, "1E+6M+1E+6M+2E", "8E+3T+3 min rest+2T+2E"],
    [0.8, "2E+3T+60 min E+1T+1E", "4E+5x(1 km I w/ 3 min jog)+4x(400m R w/ 400m jog)+2E"],
    [0.9, "lesser 16 mi/120 min E", "6E+3T+3 min E+2T+2 min E+1T+2E"],
    [0.9, "2E+8M+1E+3M+2E", "40 min E+3x(2T w/ 2 min rest)+2x(1T w/ 1 min rest)+1E"],

    if (maxr === null || !isFinite(maxr) || maxr < 1 || maxr > 3) return fail("Highest ATL / CTL must be a number from 1 to 3.");
    U = "mi";
    var riegel5 = t * Math.pow(5 / D, K) / 5, p5 = riegel5 + adj(D), c = { D: D, t: t, riegel5: riegel5, p5: p5 };
    var res = [];
    LIST.forEach(function (p) {
      SHIM.week.value = String(p[3]);
      var r = MODS[p[0]].build(p[1], c);
      if (r.err) return;
      var w = r.weeks, s = sim(w, c0, a0), tss = w.map(function (x) { return sumArr(x.d7); }), pk = 0;
      for (var i = 0; i + 4 <= tss.length; i++) pk = Math.max(pk, sumArr(tss.slice(i, i + 4)) / 28);
      var okF = s.minF >= floor - 1e-9, okR = s.maxR <= maxr + 1e-9;
      res.push({ name: p[2], weeks: w.length, w1: tss[0] / 7, pk: pk, minF: s.minF, wF: s.wF, maxR: s.maxR, wR: s.wR, okF: okF, okR: okR });
    });
    var fits = res.filter(function (x) { return x.okF && x.okR; });
    var top = null; fits.forEach(function (x) { if (!top || x.pk > top.pk) top = x; });
    $("rtitle").textContent = "Plans from CTL " + c0.toFixed(0) + ", ATL " + a0.toFixed(0);
    $("summary").textContent = fits.length === 0 ? "None of the " + res.length + " plans fit." : fits.length + " of " + res.length + " plans fit. The most demanding that fits is " + top.name + ", peaking at " + top.pk.toFixed(0) + " TSS a day.";
    $("rows").innerHTML = res.map(function (x) {
      var msg = [];
      if (!x.okF) msg.push("Form " + sgn(x.minF) + " in week " + x.wF);
      if (!x.okR) msg.push("ATL/CTL " + x.maxR.toFixed(2) + " in week " + x.wR);
      var cell = msg.length ? "<span class='flag red'>" + msg.join("; ") + "</span>" : "Fits";
      return "<tr><td>" + x.name + "</td><td class='num'>" + x.weeks + "</td><td class='num'>" + x.w1.toFixed(0) + "</td><td class='num'>" + x.pk.toFixed(0) + "</td><td class='num'>" + sgn(x.minF) + "</td><td class='num'>" + x.maxR.toFixed(2) + "</td><td class='q2'>" + cell + "</td></tr>";
    }).join("");
    $("rnote").textContent = "Form is CTL minus ATL at the end of each day, from your start values, through the last full day before the marathon. Week numbers say where the lowest form and highest ratio occur.";
    $("notes").innerHTML = [
      "<b>Test.</b> Each plan is run day by day from your start CTL and ATL. A plan fits if form never drops below the lowest form allowed and ATL / CTL never exceeds the limit. The defaults are -20 and 1.3.",
      "<b>Where the defaults come from.</b> TrainerPlan's ATL to CTL bands put 0.8 to 1.3 as the sweet spot and flag above 1.3 and 1.5, and its own alerts sit at form -10 and -20. The -20 floor is a more cautious choice for running than its -30 high-strain mark. It is not a research threshold.",
      "<b>Start values.</b> Enter your own CTL and ATL. ATL blank means the same as CTL, which is a flat start. A hard recent week raises ATL and makes early weeks fit worse.",
      "<b>Plan settings.</b> Daniels at the top of each plan's mileage band, 6 run days, short threshold reps for slower runners on. Pfitzinger long runs at 85% of marathon speed, 10km tune-up, no recovery weeks. Copeland 5km reps at 16.5 min. Change these on Marathon Plans.",
      "<b>Load.</b> " + LOADNOTE + " Peak 4-week TSS/day is the highest average over four consecutive weeks. The marathon itself is not scored.",
      "<b>Limits.</b> A plan that fits is not a plan that suits you. It says nothing about the mileage you can absorb, the long run, or injury history."
    ].map(function (x) { return "<li>" + x + "</li>"; }).join("");
  }

  function save() {
    try { profSet("km", $("dist").value); profSet("time", $("time").value); } catch (e) {}
    try { localStorage.setItem("mr", JSON.stringify({ c: $("ctl").value, a: $("atl").value, f: $("floor").value, r: $("maxr").value })); } catch (e) {}
  }
  function restore() {
    try {
      var s = JSON.parse(localStorage.getItem("mr") || "null");
      if (s) { if (typeof s.c === "string") $("ctl").value = s.c; if (typeof s.a === "string") $("atl").value = s.a; if (typeof s.f === "string") $("floor").value = s.f; if (typeof s.r === "string") $("maxr").value = s.r; }
    } catch (e) {}
    var pr = profGet();
    if (pr.km && $("dist").querySelector('option[value="' + pr.km + '"]')) $("dist").value = pr.km;
    if (pr.time) $("time").value = pr.time;
  }

  (function () {
    function norm(t) { var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.round(t % 60); return (h ? h + ":" + (m < 10 ? "0" : "") + m : m) + ":" + (s < 10 ? "0" : "") + s; }
    var el = $("time");
    el.addEventListener("change", function () {
      if (!/^\d{3,6}$/.test(el.value.trim())) return;
      var t = parseTime(el.value);
      if (t !== null) { el.value = norm(t); el.dispatchEvent(new Event("input", { bubbles: true })); }
    });
  })();

  restore();
  ["dist", "time", "ctl", "atl", "floor", "maxr"].forEach(function (id) {
    $(id).addEventListener("input", function () { save(); update(); });
    $(id).addEventListener("change", function () { save(); update(); });
  });
  update();
})();

</script>

<script>
(function () {
  var btns = document.querySelectorAll("[data-theme-set]");
  function apply(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    btns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-theme-set") === t ? "true" : "false"); });
  }
  var saved = "system";
  try { saved = localStorage.getItem("theme-pref") || "system"; } catch (e) {}
  apply(saved);
  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-theme-set");
      apply(t);
      try { localStorage.setItem("theme-pref", t); } catch (e) {}
    });
  });
})();
</script>

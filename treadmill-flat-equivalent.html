<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}.sitenav{font-size:.85rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0}.sitenav a{color:var(--accent);text-decoration:none}.sitenav a:hover{text-decoration:underline}</style>
<title>Treadmill Flat Equivalent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column (belt speed, unit and incline in a row), inputs panel then result panel. Track-red accent on white, same system as the other calculators. */
:root {
  --bg: #f2f2f1;
  --surface: #ffffff;
  --surface-2: #f0f0ee;
  --fg: #17181a;
  --muted: #6a6d72;
  --line: #deded9;
  --accent: #c8372d;
  --warn: #a35a00;
  --font-display: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1c1c1f; --surface-2: #25252a; --fg: #ececea; --muted: #9a9ca2;
    --line: #34343a; --accent: #ef6a5e; --warn: #f0a35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1c1c1f; --surface-2: #25252a; --fg: #ececea; --muted: #9a9ca2;
  --line: #34343a; --accent: #ef6a5e; --warn: #f0a35a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); }
.head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
.themes { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; background: var(--surface); }
.themes button { font: inherit; font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.themes button + button { border-left: 1px solid var(--line); }
.themes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.themes button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 18px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 480px) { .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fields label:last-child { grid-column: 1 / -1; } }
label { display: grid; gap: 4px; grid-template-rows: auto auto; font-size: .8rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
input, select { box-sizing: border-box; height: 2.75rem; font: inherit; font-size: 1.05rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 9px 10px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.warn { color: var(--warn); font-size: .88rem; margin: 0; }
.result { display: grid; gap: 10px; align-content: center; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 5.5rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: 1.6rem; font-weight: 600; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.kv div { background: var(--surface-2); border-radius: 2px; padding: 8px 10px; }
.kv b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv span { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
[hidden] { display: none !important; }
</style>

<main class="wrap">
  <p class="sitenav"><a href="index.html">&larr; All tools</a></p>
  <header class="head">
    <div>
      <h1>Treadmill Flat Equivalent</h1>
    </div>
    <div class="themes" role="group" aria-label="Theme">
      <button type="button" data-theme-set="system" aria-pressed="true">Auto</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <section class="panel">
    <h2>Treadmill</h2>
    <div class="fields">
      <label>Belt speed
        <input id="speed" type="number" inputmode="decimal" min="5" max="25" step="0.1" value="10.9">
      </label>
      <label>Unit
        <select id="unit">
          <option value="kmh" selected>km/h</option>
          <option value="mph">mph</option>
        </select>
      </label>
      <label>Incline (%)
        <input id="grade" type="number" inputmode="decimal" min="0" max="20" step="0.5" value="6">
      </label>
      <label>Display reads fast by (%)
        <input id="cal" type="number" inputmode="decimal" min="-10" max="10" step="0.1" value="1.7">
      </label>
    </div>
  </section>

  <p class="warn" id="err" hidden></p>

  <section class="panel result" id="res" aria-live="polite">
    <h2>Flat-equivalent pace</h2>
    <div class="big"><span id="pk">-</span><small>/km</small></div>
    <div class="kv" id="kv"></div>
  </section>
  <p class="sitenav"><a href="methods/treadmill-flat-equivalent.html">How it works &rarr;</a></p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MILE = 1.609344;

  function mmss(sec) {
    var s = Math.round(sec), m = Math.floor(s / 60);
    return m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
  }

  function save() {
    try { localStorage.setItem("tt-tread-cal", $("cal").value); } catch (e) {}
    try { localStorage.setItem("acsmwidget", JSON.stringify({ speed: $("speed").value, unit: $("unit").value, grade: $("grade").value })); } catch (e) {}
  }
  function restore() {
    try { var c = localStorage.getItem("tt-tread-cal"); if (c !== null && c !== "") $("cal").value = c; } catch (e) {}
    try {
      var o = JSON.parse(localStorage.getItem("acsmwidget") || "null");
      if (!o) return;
      if (o.unit === "kmh" || o.unit === "mph") $("unit").value = o.unit;
      if (o.speed !== undefined) $("speed").value = o.speed;
      if (o.grade !== undefined) $("grade").value = o.grade;
    } catch (e) {}
  }
  function fail(msg) { $("err").hidden = false; $("err").textContent = msg; $("res").hidden = true; }

  function update() {
    $("err").hidden = true;
    var unit = $("unit").value, v = parseFloat($("speed").value), g = parseFloat($("grade").value);
    var shown = unit === "mph" ? v * MILE : v;
    var cal = parseFloat($("cal").value);
    if (isNaN(cal) || cal < -10 || cal > 10) return fail("Enter a display error between -10 and 10%. Use 0 if the display is accurate.");
    var kmh = shown / (1 + cal / 100);                 // true belt speed
    if (isNaN(v) || shown < 5 || shown > 25) return fail("Enter a belt speed between 5 and 25km/h (3.1 to 15.5 mph).");
    if (isNaN(g) || g < 0 || g > 20) return fail("Enter an incline between 0 and 20%.");
    // ACSM running equation: VO2 = 0.2*S + 0.9*S*G + 3.5. Equal oxygen cost on the flat gives S_flat = S*(1 + 4.5*G).
    var flat = kmh * (1 + 4.5 * g / 100);
    $("pk").textContent = mmss(3600 / flat);
    $("kv").innerHTML =
      "<div><b>" + mmss(3600 * MILE / flat) + "</b><span>Per mile</span></div>" +
      "<div><b>" + flat.toFixed(1) + "</b><span>Flat speed, km/h</span></div>" +
      "<div><b>" + mmss(3600 / shown) + "</b><span>Display pace, /km</span></div>" +
      (cal !== 0 ? "<div><b>" + kmh.toFixed(2) + "</b><span>True belt speed, km/h</span></div>" : "");
    $("res").hidden = false;
  }

  restore();
  ["speed", "unit", "grade", "cal"].forEach(function (id) {
    $(id).addEventListener("input", function () { save(); update(); });
    $(id).addEventListener("change", function () { save(); update(); });
  });
  update();
})();

(function () {
  var btns = document.querySelectorAll("[data-theme-set]");
  function apply(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    btns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-theme-set") === t ? "true" : "false"); });
  }
  var saved = "system";
  try { saved = localStorage.getItem("theme-pref") || "system"; } catch (e) {}
  apply(saved);
  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-theme-set");
      apply(t);
      try { localStorage.setItem("theme-pref", t); } catch (e) {}
    });
  });
})();
</script>
